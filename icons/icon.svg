<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded squircle container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />
  <!-- Keyboard layout subtle pattern -->
  <rect x="22" y="24" width="20" height="14" rx="3" fill="#FFFFFF" opacity="0.15"/>
  <rect x="46" y="24" width="20" height="14" rx="3" fill="#FFFFFF" opacity="0.15"/>
  <rect x="70" y="24" width="20" height="14" rx="3" fill="#FFFFFF" opacity="0.15"/>
  <rect x="94" y="24" width="12" height="14" rx="3" fill="#FFFFFF" opacity="0.15"/>
  <!-- Spacebar bottom subtle pattern -->
  <rect x="34" y="90" width="60" height="12" rx="4" fill="#FFFFFF" opacity="0.18"/>
  <!-- Central Turbo Lightning / Cursor Bolt -->
  <polygon points="72,26 34,70 62,70 56,104 94,58 66,58" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>
